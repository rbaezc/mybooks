<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="url(#hexGrad)" stroke-width="6" fill="#090D16" filter="url(#glow)"/>
  <!-- Internal Vertical Slices -->
  <rect x="30" y="32" width="9" height="36" rx="2" fill="#06B6D4" opacity="0.9"/>
  <rect x="44" y="24" width="12" height="52" rx="3" fill="#6366F1"/>
  <rect x="61" y="32" width="9" height="36" rx="2" fill="#A855F7" opacity="0.9"/>
  <!-- Core Node Points -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
</svg>
